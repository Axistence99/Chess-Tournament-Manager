<!doctype html>
<!-- Static document shell; the TypeScript application renders into #app. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1210" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta
      name="description"
      content="Offline-first professional chess tournament pairing manager"
    />
    <script>
      (() => {
        const theme = localStorage.getItem("castling.theme.v1");
        if (["dark", "light", "criterion", "ggcc"].includes(theme)) {
          document.documentElement.dataset.theme = theme;
          if (theme === "ggcc") {
            document.querySelector('link[rel="icon"]').href = "./ggcc-logo.png";
            document.querySelector('link[rel="apple-touch-icon"]').href =
              "./ggcc-logo.png";
          }
        }
      })();
    </script>
    <title>Chest-Tournament Manager</title>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
