<!doctype html>
<!-- Static document shell; the TypeScript application renders into #app. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#1c503a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Chest Manager" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta
      name="description"
      content="Offline-first professional chess tournament pairing manager"
    />
    <script>
      (() => {
        const savedTheme = localStorage.getItem("castling.theme.v1");
        const themes = ["dark", "light", "criterion", "ggcc", "ceit"];
        const theme = themes.includes(savedTheme) ? savedTheme : "criterion";
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute(
            "content",
            theme === "light"
              ? "#f3f6f4"
              : theme === "criterion"
                ? "#1c503a"
                : theme === "ggcc"
                  ? "#080b10"
                  : theme === "ceit"
                    ? "#090604"
                    : "#0b1210",
          );
        if (theme === "ggcc") {
          document.querySelector('link[rel="icon"]').href = "./ggcc-logo.png";
          document.querySelector('link[rel="apple-touch-icon"]').href =
            "./ggcc-logo.png";
        }
      })();
    </script>
    <title>Chest-Tournament Manager</title>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
